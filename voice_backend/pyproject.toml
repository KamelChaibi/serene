[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "serene-voice-backend"
version = "1.0.0"
description = "Self-hosted real-time voice backend for the Serene companion app"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Serene" }]

# The public API container installs only these.  It must stay light: no torch,
# no CUDA, no model weights.
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
  "livekit-api>=1.2,<2",
]

[project.optional-dependencies]
# LiveKit Agents worker.  It calls local HTTP services, so it needs no GPU.
agent = [
  "livekit-agents[silero]>=1.8.10,<1.9",
  "livekit-plugins-openai>=1.8.10,<1.9",
  "openai>=3.28,<4",
  "httpx2>=2.12,<3",
  "PyYAML>=6.0,<7",
]

# faster-whisper.  GPU execution additionally needs the NVIDIA container
# toolkit (or a CUDA-enabled host) and the cuBLAS/cuDNN wheels in the image.
stt = [
  "faster-whisper>=1.1,<2",
  "python-multipart>=0.0.9,<1",
]

# English and French.  Small, fast, 24 kHz.
tts = [
  "kokoro>=0.9.4,<1",
  "soundfile>=0.12,<1",
  "numpy==1.26.4",
]

# Arabic.  SILMA TTS is an F5-TTS derivative and pulls a heavy stack.
# `pynini` only publishes manylinux wheels, so this group is Linux-only.
# Install with: pip install ".[tts,tts-ar]"
tts-ar = [
  "silma-tts==1.0.5",
  "nemo_text_processing==1.1.0",
  "pynini==2.1.6.post1",
  "numpy==1.26.4",
]

dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "PyJWT>=2.8,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
