<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Serene is a free, private AI mental wellness companion. Talk, breathe, ground and journal — in Arabic, French and English.">
  <meta name="color-scheme" content="light dark">
  <meta name="format-detection" content="telephone=no">

  <!-- Browser / Android theme colour -->
  <meta name="theme-color" content="#F4F8F5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131816" media="(prefers-color-scheme: dark)">

  <!--
    iOS standalone (Add to Home Screen) configuration.
    `apple-mobile-web-app-capable` is still what iOS < 17 reads; the
    non-prefixed `mobile-web-app-capable` is the standard version.
  -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Serene">

  <!-- iOS home-screen icon. iOS ignores the manifest icons, so these matter. -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="icons/apple-touch-icon-120.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Serene</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Branded iOS launch screens. iOS picks the first matching media query and
    otherwise flashes a plain white screen while the web app starts.
  -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)" href="splash/splash-640x1136.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="splash/splash-750x1334.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3)" href="splash/splash-1242x2208.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" href="splash/splash-1125x2436.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" href="splash/splash-828x1792.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" href="splash/splash-1242x2688.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="splash/splash-1170x2532.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" href="splash/splash-1284x2778.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="splash/splash-1179x2556.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="splash/splash-1290x2796.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3)" href="splash/splash-1206x2622.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3)" href="splash/splash-1320x2868.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2)" href="splash/splash-1536x2048.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 810px) and (device-height: 1080px) and (-webkit-device-pixel-ratio: 2)" href="splash/splash-1620x2160.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2)" href="splash/splash-1640x2360.png">

  <style>
    /* Keep the first paint calm instead of flashing white. */
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F4F8F5;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    #serene-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: linear-gradient(180deg, #F4F8F5 0%, #E4EFE8 100%);
      opacity: 1;
      transition: opacity 420ms ease;
      pointer-events: none;
    }

    #serene-loader.is-hidden {
      opacity: 0;
    }

    #serene-loader img {
      width: 96px;
      height: 96px;
      animation: serene-breathe 2.8s ease-in-out infinite;
    }

    #serene-loader .wordmark {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-indent: 0.22em;
      color: #356B60;
    }

    #serene-loader .bar {
      width: 44px;
      height: 3px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(53, 107, 96, 0.15);
    }

    #serene-loader .bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: inherit;
      background: rgba(53, 107, 96, 0.6);
      animation: serene-loading 1.4s ease-in-out infinite;
    }

    #serene-loader.has-error .bar {
      display: none;
    }

    @keyframes serene-breathe {
      0%, 100% { transform: scale(0.94); opacity: 0.9; }
      50% { transform: scale(1); opacity: 1; }
    }

    @keyframes serene-loading {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }

    @media (prefers-color-scheme: dark) {
      html,
      body {
        background: #131816;
      }

      #serene-loader {
        background: linear-gradient(180deg, #131816 0%, #1B2421 100%);
      }

      #serene-loader .wordmark {
        color: #9CCFC1;
      }

      #serene-loader .bar {
        background: rgba(156, 207, 193, 0.15);
      }

      #serene-loader .bar::after {
        background: rgba(156, 207, 193, 0.6);
      }
    }

    noscript {
      display: block;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #356B60;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="serene-loader" role="status" aria-live="polite" aria-label="Loading Serene">
    <img src="icons/Icon-192.png" alt="">
    <div class="wordmark">Serene</div>
    <div class="bar"></div>
  </div>

  <noscript>Serene needs JavaScript enabled to run. Please enable it and reload the page.</noscript>

  <!--
    You can customise the bootstrap in web/flutter_bootstrap.js. Serene uses it
    to register its own service worker and to fade out the loader above.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
